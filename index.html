<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GT7 Setup Lab — MVP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>GT7 Setup Lab — MVP</h1>
    <p>Generate and store simple car setups for Gran Turismo 7 (static demo).</p>
  </header>

  <main>
    <section class="controls">
      <label for="vehicle-select">Vehicle</label>
      <select id="vehicle-select"></select>

      <div class="buttons">
        <button id="generate-btn">Generate Setup</button>
        <button id="save-btn">Save Current</button>
        <button id="load-btn">Load Saved</button>
        <button id="reset-btn">Reset</button>
      </div>
    </section>

    <section class="form">
      <h2>Setup</h2>
      <div class="row"><label>Ride Height</label><input id="rideHeight" type="range" min="0" max="50" value="25"></div>
      <div class="row"><label>Spring Rate (F/R)</label><input id="springF" type="number" min="0" max="100" value="30"> / <input id="springR" type="number" min="0" max="100" value="30"></div>
      <div class="row"><label>ARB (F/R)</label><input id="arbF" type="number" min="0" max="50" value="10"> / <input id="arbR" type="number" min="0" max="50" value="10"></div>
      <div class="row"><label>Brake Bias</label><input id="brakeBias" type="range" min="40" max="60" value="50"></div>
    </section>

    <section class="result">
      <h2>Generated / Saved Setup</h2>
      <pre id="output">(no setup)</pre>
    </section>
  </main>

  <footer>
    <small>Static MVP — saves per-vehicle setups to localStorage.</small>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
